{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block contenido %}
<div class="tarjeta" style="max-width:420px">
  <h1>Entrar</h1>
  <form method="post">{% csrf_token %}
    {% if form.non_field_errors %}<p class="error">Usuario o contraseña incorrectos.</p>{% endif %}
    <label for="id_username">Usuario</label>{{ form.username }}
    <label for="id_password">Contraseña</label>{{ form.password }}
    <input type="hidden" name="next" value="{{ next }}">
    <p style="margin-top:1rem"><button>Entrar</button></p>
  </form>
</div>
{% endblock %}
