{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Impresión{% endblock %} · Sistema de impresión</title>
  <script src="{% static 'js/htmx.min.js' %}"></script>
  <style>
    :root { --borde:#d0d4da; --primario:#1f5fbf; --error:#b42318; --suave:#f4f6f8; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,-apple-system,"Segoe UI",sans-serif; margin:0; color:#1b1f24; background:#fff; }
    nav { display:flex; gap:1.25rem; padding:.75rem 1.5rem; background:#16213a; }
    nav a { color:#e8edf5; text-decoration:none; font-weight:500; }
    nav a:hover { text-decoration:underline; }
    main { max-width:1100px; margin:1.5rem auto; padding:0 1.5rem; }
    h1 { font-size:1.5rem; margin:0 0 1rem; }
    table { border-collapse:collapse; width:100%; }
    th, td { text-align:left; padding:.5rem; border-bottom:1px solid var(--borde); vertical-align:top; }
    button, .boton { background:var(--primario); color:#fff; border:0; border-radius:6px; padding:.55rem 1rem; font-size:1rem; cursor:pointer; text-decoration:none; display:inline-block; }
    button.secundario { background:#e5e9ef; color:#1b1f24; }
    button.peligro { background:var(--error); }
    input, select { font-size:1rem; padding:.4rem; border:1px solid var(--borde); border-radius:6px; }
    label { display:block; margin:.6rem 0 .2rem; font-weight:500; }
    .error { color:var(--error); }
    .aviso { background:#fff6e0; border:1px solid #f0c36d; padding:.6rem .8rem; border-radius:6px; margin:.75rem 0; }
    .insignia { background:#f0c36d; border-radius:999px; padding:.1rem .5rem; font-size:.8rem; }
    .fila { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end; }
    .tarjeta { border:1px solid var(--borde); border-radius:8px; padding:1rem; background:var(--suave); }
    .sugerencia { color:#334155; background:#eef4ff; display:inline-block; padding:.3rem .6rem; border-radius:6px; margin:.5rem 0 0; }
    .sugerencia:empty { display:none; }
    .pagina-elegible { display:flex; flex-direction:column; align-items:center; gap:.2rem; cursor:pointer; font-weight:400; margin:0; padding:.3rem; border:2px solid var(--primario); border-radius:6px; background:#fff; }
    .pagina-elegible img { height:120px; border:1px solid var(--borde); }
    .pagina-elegible.apagada { border-color:var(--borde); opacity:.45; }
    .numero { font-variant-numeric:tabular-nums; text-align:right; }
  </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav>
    <a href="/">Imprimir</a>
    <a href="/perfiles/">Perfiles</a>
    <a href="/impresoras/">Impresoras</a>
    <a href="/historial/">Historial</a>
    <a href="/tarifas/calibracion/">Calibración</a>
    <a href="/admin/tarifas/">Tarifas</a>
  </nav>
  <main>
    {% if messages %}{% for m in messages %}<div class="aviso">{{ m }}</div>{% endfor %}{% endif %}
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
