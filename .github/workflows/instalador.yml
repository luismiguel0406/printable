name: Instalador

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Versión
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "0.0.0-ci.${{ github.run_number }}" }
          "VERSION=$v" >> $env:GITHUB_ENV

      - name: Pruebas en Windows
        shell: pwsh
        env:
          IMPRESORA_BACKEND: falso
        run: |
          python -m pip install --disable-pip-version-check -r requirements-windows.txt
          python -m pytest -q -rs

      - name: Construir el instalador
        shell: pwsh
        run: ./instalador/construir.ps1 -Version $env:VERSION

      - name: Guardar el instalador
        uses: actions/upload-artifact@v4
        with:
          name: PrintableSetup-${{ env.VERSION }}
          path: dist/PrintableSetup-*.exe

      - name: Probar la instalación
        shell: pwsh
        run: ./instalador/probar_instalacion.ps1 -Setup "dist/PrintableSetup-$env:VERSION.exe"

      - name: Registro de Printable
        if: always()
        shell: pwsh
        run: Get-Content "$env:ProgramData\Printable\logs\printable.log" -Tail 80 -ErrorAction SilentlyContinue


      - name: Publicar versión
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PrintableSetup-*.exe
          generate_release_notes: true
